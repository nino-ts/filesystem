name: Publish package on registry

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC) — no registry secrets.
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      # CI-only: enables npm Trusted Publishing / OIDC.
      # Product support matrix remains Bun-only; this does not reintroduce Node as a runtime.
      - name: Set up Node (npm OIDC helper)
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          scope: "@ninots"

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Publish to JSR
        run: bunx --bun jsr publish --allow-slow-types --allow-dirty